        <main>
            <h1>商品管理</h1>

            <div class="action-area">
                <div class="add-product-container">
                    <button class="add-product-btn">
                        <img src="img/Plus.png" alt="">
                        <i class="fa-solid fa-plus"></i> 新しい商品を追加
                    </button>

                    <div class="add-panel">
                        <h2 class="add-panel-title">新しい商品</h2>
                        <div class="add-panel-body">
                            <div class="form-group">
                                <label>商品名</label>
                                <input type="text" placeholder="例）やきそば" class="modal-input js-add-name">
                            </div>
                            <div class="form-group">
                                <label>価格（円）</label>
                                <input type="number" min="0" placeholder="例）400" class="modal-input js-add-price">
                            </div>
                            <div class="form-group">
                                <label>在庫数</label>
                                <input type="number" min="0" placeholder="例）100" class="modal-input js-add-stock">
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn-cancel js-add-cancel">キャンセル</button>
                                <button type="button" class="btn-save js-add-save">追加</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <hr>

            <div class="product-grid">
                <!-- 商品カードはitems.jsによって動的に描画されます -->

            </div>
        </main>

        <script src="js/config.js"></script>
        <script type="module" src="js/header.js"></script>
        <script type="module" src="js/items.js"></script>
        <script src="js/toast.js"></script>
        <script src="js/ripple.js"></script>
    </body>
