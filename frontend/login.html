    <body>
        <main>
            <div class="login">
                <div class="login-logo m3-avatar m3-avatar-1">
                    <span class="m3-icon m3-icon-fill">storefront</span>
                </div>
                <h1 class="app-title">
                    Zeniq
                </h1>
                <span class="app-sub-title">学祭用POSレジアプリ</span>
                <p class="login-explain for-login">
                    お店のアカウントでログインしてください。<br>
                    <!-- アカウントをお持ちでない方は「新規作成」からアカウントを作成してください。 -->
                </p>

                <!-- <p class="login-explain for-register">
                    お店のアカウントを新規作成してください。
                </p> -->

                <form id="login-form" class="for-login">
                    <div class="form-item">
                        <label for="login-username">ユーザー名</label>
                        <input type="text" id="login-username" placeholder="例）your_store_name" autocomplete="username"
                            required>
                    </div>
                    <div class="form-item">
                        <label for="login-password">パスワード</label>
                        <input type="password" id="login-password" placeholder="例）password"
                            autocomplete="current-password" required>
                    </div>

                    <p class="form-error" id="login-error" hidden></p>

                    <button type="submit" id="login-submit">ログイン</button>
                </form>

                <!-- <form id="register-form" class="for-register">
                    <div class="form-item">

                    </div>
                    <div class="form-item">
                        <label for="register-username">ユーザー名</label>
                        <input type="text" id="register-username" placeholder="例）your_store_name" autocomplete="username" required>
                    </div>
                    <div class="form-item">
                        <label for="register-password">パスワード</label>
                        <input type="password" id="register-password" placeholder="例）password" autocomplete="new-password" required>
                    </div>

                    <p class="form-error" id="register-error" hidden></p>

                    <button type="submit" id="register-submit">新規作成</button>
                </form> -->
            </div>
        </main>


        <script src="js/config.js"></script>
        <script type="module" src="js/login.js"></script>
